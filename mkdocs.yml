# Documentation site, built by Zensical (`make docs` / `make docs-build`) from the Markdown in docs/
# and published to GitHub Pages by .github/workflows/docs.yml. Zensical reads this mkdocs.yml format.
site_name: Fastkern
site_description: Enterprise FastAPI boilerplate. Modular monolith, Clean Architecture, multi-tenancy, RBAC.
site_url: https://sandimvlyadi.github.io/fastkern/
repo_url: https://github.com/sandimvlyadi/fastkern
repo_name: sandimvlyadi/fastkern
copyright: MIT License

docs_dir: docs

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  # Follows the operating system's light/dark setting until the reader picks one.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Follow the system setting

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

# The decision records under adr/ are built too, and linked from Architecture's index of them
# rather than listed one by one here.
nav:
  - Home: index.md
  - Getting started:
      - Try it from the image: quickstart.md
      - Build your service: new-service.md
  - Guides:
      - Architecture: architecture.md
      - Development: development.md
      - Module guide: module-guide.md
      - Testing: testing.md
      - Security model: security.md
      - i18n and timezone: i18n-and-timezone.md
      - Observability: observability.md
  - Operations:
      - Running in production: production.md
      - Deploying to a VPS: deploy-vps.md
      - Rolling back a release: rollback.md
