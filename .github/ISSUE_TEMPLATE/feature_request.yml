name: Feature Request
description: Propose a new capability or meaningful improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement.

        Please describe the problem and expected outcome rather than only the implementation you have in mind.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation would this feature solve?
      placeholder: Describe the use case and why the current behavior is insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the behavior or capability you would like to see.
      placeholder: Describe the desired behavior from a user's or developer's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternative approaches or workarounds you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / Security
        - Authorization / RBAC
        - Multi-tenancy
        - Database
        - API / Presentation
        - Background Jobs
        - Caching
        - Observability
        - Internationalization / Timezone
        - Developer Experience
        - Testing
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Notes
      description: Optional technical details, architecture considerations, or references.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is relevant to the scope of the Fastkern boilerplate.
          required: true
