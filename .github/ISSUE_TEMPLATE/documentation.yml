name: Documentation
description: Report unclear, missing, outdated, or incorrect documentation.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation Location
      description: Provide the file, section, page, or URL where the issue exists.
      placeholder: README.md — Getting started / docs/security.md / a page on the documentation site
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Documentation Issue
      options:
        - Incorrect information
        - Missing information
        - Unclear explanation
        - Outdated information
        - Typo / grammar
        - Broken link
        - Example does not work
        - Other
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current Content
      description: Quote or describe the relevant content.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Suggested Improvement
      description: Explain what should be changed or added.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Include relevant links, examples, or references.
    validations:
      required: false
