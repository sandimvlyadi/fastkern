# Weekly update PRs, so a dependency with a newly published CVE doesn't sit unnoticed until the
# next manual sweep. Security updates (Dependabot alerts) are raised immediately, regardless of
# this schedule. Every PR still has to pass the full CI, including pip-audit and the image scan.
version: 2
updates:
  # pyproject.toml + uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # kombu (Celery's transport) and limits[redis] both cap redis-py below 8, so a major bump
      # can never resolve and only fails the weekly job. Drop this once both allow redis 8.
      - dependency-name: redis
        update-types: ["version-update:semver-major"]

  # Dockerfile base images (pinned by digest) and the uv binary image
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # docker-compose service images (postgres, redis, mailpit, clamav)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
